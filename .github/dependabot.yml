version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - react
          - react-dom
          - react-native
          - react-native-*
          - '@react-native/*'
          - '@react-native-community/*'
          - '@types/react'
          - '@types/react-dom'
          - babel-preset-expo
          - eslint-config-expo
        update-types:
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
      application:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Group update-types only groups PRs; it does not block standalone major PRs.
    # SDK 54 packages stay on their current major/minor release lines. CI Doctor
    # remains the compatibility gate: Dependabot cannot infer Expo SDK support.
    # Independent npm dependencies retain minor/patch updates; majors are manual.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: expo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo-*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@expo/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@react-native/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@react-native-community/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: babel-preset-expo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: eslint-config-expo
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Allow patch/security fixes; CI (including Expo Doctor) checks compatibility.
      # Minor and major upgrades still require coordinated SDK review.
      - dependency-name: react
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-worklets
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'

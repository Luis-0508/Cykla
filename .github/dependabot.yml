version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react', 'react-dom', 'react-native', 'react-native-*']
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
      application:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

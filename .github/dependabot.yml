version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    # The Expo SDK pins these; upgrade them with `npx expo install --fix` instead.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
    groups:
      expo-stack:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - react
          - react-dom
          - react-native
          - react-native-*
          - '@react-native/*'
          - '@react-native-community/*'
          - '@types/react'
          - '@types/react-dom'
          - babel-preset-expo
          - eslint-config-expo
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '10 6 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        patterns:
          - '*'
        update-types:
          - patch
    commit-message:
      prefix: ci

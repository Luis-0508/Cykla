      - any-glob-to-any-file: ['app/**', 'src/components/**', 'src/theme/**', 'src/i18n/**']
database:
  - changed-files:
      - any-glob-to-any-file: ['src/database/**']
domain:
  - changed-files:
      - any-glob-to-any-file: ['src/domain/**']

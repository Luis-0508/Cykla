name: Format PR 18 changed files
on:
  push:
    branches:
      - fix/observed-days-and-prediction-20260925
    paths:
      - .github/workflows/format-pr18.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format changed TS and TSX files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/master...HEAD -- '*.ts' '*.tsx')
          if (( ${#files[@]} )); then
            npx prettier --write "${files[@]}"
            git add -- "${files[@]}"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Prettier to changed files'
            git push origin HEAD:fix/observed-days-and-prediction-20260925
          fi

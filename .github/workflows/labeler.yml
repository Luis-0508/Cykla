name: Pull request labels
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads configuration from the trusted base branch through GitHub's API.
      # Never check out or run pull request code in this privileged workflow.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false

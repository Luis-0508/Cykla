name: Temporary dependency repair 41
on:
  push:
    branches:
      - dependabot/npm_and_yarn/eslint-10.12.0
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --save-dev @eslint/compat@latest
      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lint: add ESLint 10 compatibility adapter"
          git push origin HEAD:${{ github.ref_name }}

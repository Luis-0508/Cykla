name: One-time Expo SDK 57 upgrade
on:
  push:
    branches:
      - chore/expo-sdk-57-20260925
    paths:
      - .github/workflows/upgrade-sdk57.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.repository == 'Luis-0508/Cykla'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Upgrade Expo and align SDK-managed dependencies
        run: |
          npm install expo@^57.0.23 --save --legacy-peer-deps
          npm_config_legacy_peer_deps=true npx expo install --fix --npm
      - name: Commit generated dependency manifest and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit'
          else
            git commit -m 'build: upgrade Expo SDK and aligned dependencies to 57'
            git push origin HEAD:chore/expo-sdk-57-20260925
          fi
      - name: Verify clean install and Expo dependencies
        run: |
          npm ci
          npx expo-doctor
      - name: Verify TypeScript, lint and tests
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build:smoke

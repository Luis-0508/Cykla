name: Feature request
description: Suggest an improvement consistent with Cykla's privacy principles.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check ROADMAP.md first, including the "Not Planned" section. Do not include personal health information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Do not include personal health information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and offline use
      description: Would this change local storage, exports, or data transmission?

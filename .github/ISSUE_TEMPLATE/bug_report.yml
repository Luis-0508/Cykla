name: Bug report
description: Report a reproducible problem using synthetic data only.
body:
  - type: markdown
    attributes:
      value: Do not include real health data, database files, exports or personal screenshots. Report vulnerabilities privately; see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: App version or commit, OS version, device, Expo Go or development build
    validations:
      required: true
